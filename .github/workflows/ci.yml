name: Dallol CI

on:
  push:
    branches: [main-Dallol-1st, 'feature/**']
  pull_request:
    branches: [main-Dallol-1st]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dallol
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dallol
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d dallol"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
