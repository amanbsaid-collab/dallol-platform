name: Dallol CI

on:
  push:
    branches: [main-Dallol-1st, 'feature/**']
  pull_request:
    branches: [main-Dallol-1st]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
