services:
  - type: web
    name: dallol-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
