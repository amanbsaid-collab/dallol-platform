services:
  - type: web
    name: dallol-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
